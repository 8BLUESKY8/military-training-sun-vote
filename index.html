<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7c900">
  <title>向日葵阳光挑战</title>
  <link rel="stylesheet" href="index.css">
<style>
  /* 首屏先显示纯色，不等待大背景图 */
  body {
    background: #f7c900 !important;
  }

  .page {
    background: linear-gradient(#fff7bd80, #f8cf4a75) !important;
  }

  /* 页面空闲后由 index.js 添加 background-ready */
  html.background-ready .page {
    background:
      linear-gradient(#fff7bd80, #f8cf4a75),
      url('pvz-background.jpg') center 30% / cover no-repeat !important;
  }

  .page::before,
  .page::after {
    display: none !important;
  }
</style>


  
</head>


  
<body>
  <main class="page">
    <div class="game-badge">🌻 军训植物园 · 阳光挑战</div>
    <section class="hero-title"><h1>收集阳光比拼</h1><p>新生晒多黑由你决定！</p></section>
    <section class="card total-card">
      <div class="sun-icon sunflower-photo"><img src="sunflower.jpg" width="256" height="229" decoding="async" fetchpriority="high" alt="向日葵"></div>
      <div><div class="label">当前阳光数</div><div class="total" id="totalSun">0</div></div>
    </section>
    <section class="card compare-card">
      <div class="number sun-number"><span>🌻</span><b id="increaseVotes">0</b></div>
      <div class="bar"><i id="sunRatio"></i></div>
      <div class="number cloud-number"><b id="decreaseVotes">0</b><span>❄</span></div>
    </section>
    <section class="card notice"><h2>📣 向日葵公告栏</h2><p>每次点击都会召唤一朵小向日葵！投票次数不限，快来帮助你的阵营收集更多阳光吧。</p></section>
    <section class="vote-grid">
      <button class="vote increase" data-vote="increase"><span class="round sunflower-photo"><img src="sunflower.jpg" width="256" height="229" decoding="async" alt="向日葵"></span><strong>种下向日葵</strong><small>阳光 +1</small></button>
      <button class="vote decrease" data-vote="decrease"><span class="round ice-photo"><img src="ice-shooter.jpg" width="256" height="207" decoding="async" alt="寒冰射手"></span><strong>种下寒冰射手</strong><small>阳光 -1</small></button>
    </section>
  </main>
  <div id="fallingSunflowers" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="index.js" defer></script>
</body>
</html>
